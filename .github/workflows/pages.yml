name: Landingpage veröffentlichen

# Baut docs/ und stellt es als GitHub Pages bereit.
#
# Voraussetzung, einmalig von Hand: Settings → Pages → Source „GitHub Actions".
# Das lässt sich nicht automatisieren – der GITHUB_TOKEN eines Workflows darf
# keine Pages-Site anlegen (Resource not accessible by integration), dafür
# braucht es Repo-Admin-Rechte. Ist Pages einmal aktiv, läuft alles Weitere hier.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Deployments nicht abbrechen, aber nur eines gleichzeitig zulassen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: docs/ als Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deployen
        id: deployment
        uses: actions/deploy-pages@v4
